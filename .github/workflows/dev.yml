name: Backend CI/CD Dev

on:
  workflow_dispatch:

env:
  APP_NAME: watchbox-be
  DOCKER_IMAGE: watchbox-be:latest

jobs:
  build-and-deploy:
    runs-on: [self-hosted, dev, backend]
    environment: development

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test --no-daemon --max-workers=1
        env:
          GRADLE_OPTS: -Xmx384m -XX:MaxMetaspaceSize=192m -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1

      - name: Build Docker image
        run: docker build -f Dockerfile -t ${{ env.DOCKER_IMAGE }} .

      - name: Create .env file for Docker
        run: |
          cat <<'EOF' > watchbox-dev-be.env
          SPRING_PROFILES_ACTIVE=dev
          DB_URL=${{ secrets.DB_URL }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          JWT_ISSUER=${{ secrets.JWT_ISSUER }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          EOF

      - name: Run docker container on watchbox-dev server
        run: |
          docker stop ${{ env.APP_NAME }} || true
          docker rm -f ${{ env.APP_NAME }} || true
          docker run -d \
            --name ${{ env.APP_NAME }} \
            --env-file ./watchbox-dev-be.env \
            --network watchbox-net \
            -p 8080:8080 \
            -v /home/ubuntu/backup/spring-boot/logs:/app/logs \
            ${{ env.DOCKER_IMAGE }}
          docker image prune -f
