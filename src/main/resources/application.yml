server:
  port: 9000
  # nginx 가 TLS 를 종료하고 평문 HTTP 로 프록시한다. 이 설정이 없으면 앱이 보는 scheme 이 http 라,
  # 브라우저가 보낸 Origin(https://...) 과 불일치해 동일 출처 요청도 교차 출처로 판정된다.
  # (Spring 의 CorsUtils.isCorsRequest 가 Origin 을 scheme·host·port 와 비교한다)
  # → Swagger 에서 POST 시 403 "Invalid CORS request". nginx 는 이미 X-Forwarded-Proto 를 보내고 있다.
  forward-headers-strategy: framework
#  compression:
#    enabled: true
#    mime-types: application/json
#    min-response-size: 2048

#logging:
#  level:
#    root: INFO
#    net.watchbox: INFO

spring:
  application:
    name: watchbox-spring

  # 리액티브 체인(WebClient·Lettuce)이 이벤트 루프로 넘어갈 때 트레이스 컨텍스트를 함께 옮긴다.
  # 기본값 LIMITED 에서는 Netty 이벤트 루프에서 실행되는 Redis 명령이 부모 span 을 못 찾아
  # 캐시 조회가 트레이스에 안 잡힌다.
  reactor:
    context-propagation: auto

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        highlight_sql: true
        generate_statistics: false
    open-in-view: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/watchbox?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:95206326}

  # SES SMTP. 발송처(SES/Gmail 등)는 이 설정으로만 갈리고 MailSendService 코드는 바뀌지 않는다.
  # username/password 는 SES 콘솔에서 발급하는 SMTP 자격증명(IAM 액세스 키와 다른 값)이다.
  mail:
    host: ${MAIL_HOST:email-smtp.ap-northeast-2.amazonaws.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 기본값이 무한이라 SMTP 연결이 물리면 메일 스레드가 영영 잡힌다.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0                        # Redis DB 인덱스 (0~15), 기본 0
      client-type: lettuce
      timeout: 2s                        # 명령 실행 timeout (중요)
      connect-timeout: 2s                # 커넥션 연결 timeout
      lettuce:
        pool:
          enabled: false                 # Lettuce 는 공유 커넥션 사용, 기본 비활성화
        shutdown-timeout: 100ms          # 종료 시 대기

  web:
    resources:
      add-mappings: false # 정적 리소스 자동 매핑 비활성화하여 예외(NoHandlerFoundException) 발생시키기 위함

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account

  cloud:
    aws:
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${S3_BUCKET}
        exp-time: 300000  # presigned URL 유효시간 (ms) = 5분

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all # 모든 replica ACK (안전)
      retries: 3
      properties:
        enable.idempotence: true # 중복 방지
        # 브로커가 꺼져 있으면 send() 가 이 시간만큼 블로킹한 뒤 예외를 던진다.
        # 기본값 60초로는 카프카를 꺼둔 상태에서 요청이 1분간 멈춘다.
        max.block.ms: 3000

    consumer:
      group-id: watchbox-consumer-${spring.profiles.active}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: net.watchbox.*
        spring.json.use.type.headers: false

    # produce / consume 스팬을 만든다. 켜지 않으면 Kafka 구간이 trace 에 통째로 빠지고,
    # traceparent 헤더도 실리지 않아 발행과 소비가 다른 trace 로 흩어진다.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

    # AdminClient 용 (헬스체크에서 사용)
    admin:
      properties:
        request.timeout.ms: 3000

# 토픽 이름 환경별 분리
kafka:
  topics:
    health-check: ${spring.profiles.active}.healthcheck
    notification-events: ${spring.profiles.active}.notification-events
    domain-events: ${spring.profiles.active}.domain-events

#logging:
#  level:
#    org.hibernate.orm.jdbc.bind: trace

# 파일(S3/CDN) 접근 base URL — URL 조립·검증의 단일 출처.
# CloudFront 도입 시 이 값만 CDN 도메인으로 교체하면 됨.
file:
  base-url: https://${S3_BUCKET}.s3.ap-northeast-2.amazonaws.com

tmdb:
  api:
    key: ${TMDB_API_KEY}
    base-url: https://api.themoviedb.org/3
    include_adult: true
  image-url: https://image.tmdb.org/t/p/w500
  cache:
    # 캐시 on/off 토글. 같은 빌드로 캐시 유무를 A/B 측정하기 위한 것(빌드 차이가 비교에 안 섞이게).
    enabled: ${TMDB_CACHE_ENABLED:true}
    # 기동 직후 홈 캐시를 미리 채운다. 첫 사용자가 콜드 스타트 비용(1.4~1.9초)을 안 내게 하는 것이 목적.
    warmup-on-startup: ${TMDB_CACHE_WARMUP:true}
    # TTL 만료 전에 주기적으로 선제 갱신한다. 사용자가 miss(~900ms)를 아예 겪지 않게 하는 것이 목적.
    warmup-scheduled: ${TMDB_CACHE_WARMUP_SCHEDULED:true}
    # 가장 짧은 TTL(2h)보다 작아야 만료 전에 갱신된다. 여유 1시간.
    warmup-interval: 1h
    # TTL 은 목록 변동성에 따라 차등. TMDB 데이터는 우리가 못 바꾸니 명시적 무효화 없이 만료로만 갱신.
    # 저트래픽에서는 hit rate ≈ TTL / 평균 방문간격 이라, TTL 이 짧으면 캐시가 사실상 동작하지 않는다.
    #
    # 알려진 한계: page 1 은 워밍이 갱신하지만 page 2 이후는 TTL 로만 산다. 두 스냅샷의 시차만큼
    # 순위가 어긋나 같은 작품이 두 페이지에 겹치거나 사라진다(offset 페이지네이션의 고유 문제이고
    # 캐시는 시차를 벌릴 뿐이다). 프론트에서 tmdbId 기준 중복 제거로 대응한다.
    trending-ttl: 2h       # trending — 주간 트렌딩이라 15분 TTL 은 과하게 짧았음
    now-showing-ttl: 2h    # now-playing / on-the-air
    stable-ttl: 12h        # popular / top-rated — 거의 고정

url:
  # 메일 본문의 '바로가기' 링크. 프론트 주소다.
  service: ${WEB_SERVICE_URL:http://localhost:4000}
  # CORS 허용 오리진(쉼표 구분). 운영/개발 프론트 + 로컬 WebView 앱 테스트(맥 LAN IP).
  # dev·prod 는 URL_CORS_ORIGINS 로 주입, 로컬은 아래 기본값 사용.
  cors-origins: ${URL_CORS_ORIGINS:http://localhost:4000,http://localhost:3000,http://192.168.*.*:4000}
  oauth-callback: ${URL_OAUTH_CALLBACK:http://localhost:4000/api/auth/callback}
#  backend:  ${URL_BACKEND:http://localhost:9000}

admin:
  api-key: ${ADMIN_API_KEY:admin}

# Sign in with Apple. Spring Security 등록이 아닌 커스텀 처리(AppleNativeAuthService / AppleWebLoginController)라 최상위 프로퍼티로 둔다.
apple:
  # identityToken(JWT) 검증 시 허용할 aud 목록(쉼표). 네이티브=iOS 번들ID, 웹=Services ID 둘 다 넣는다.
  client-ids: ${APPLE_CLIENT_IDS:net.watchbox.app}
  web:
    client-id: ${APPLE_WEB_CLIENT_ID:}        # 웹 Services ID (예: net.watchbox.service.dev)
    redirect-uri: ${APPLE_WEB_REDIRECT_URI:}  # Apple 에 등록한 https 콜백 (…/oauth2/apple/callback)

jwt:
  issuer: ${JWT_ISSUER:abc}
  secret_key: ${JWT_SECRET_KEY:abcdefgh1234567890}
  access_token_expiry: ${ACCESS_TOKEN_EXPIRY:900}s # 15분 (900초)
  refresh_token_expiry: ${REFRESH_TOKEN_EXPIRY:604800}s # 7일 (604800초)

cookie:
  domain: ${COOKIE_DOMAIN:}          # 로컬: 비움(host-only) / 개발·운영: .watch-box.net
  secure: ${COOKIE_SECURE:false}     # 로컬: false(http) / 운영: true(https)

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    doc-expansion: none
    persist-authorization: true
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info               # actuator UI 만 (prometheus 안 씀 — OTel push)
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

  opentelemetry:
    resource-attributes:
      service.namespace: watchbox
      deployment.environment: ${SPRING_PROFILES_ACTIVE:local}

  # Trace
  tracing:
    enabled: ${TRACING_ACTIVATED:true}
    sampling:
      probability: ${TRACING_SAMPLE_RATIO:1.0}
    propagation:
      type: w3c

  # OTLP exporter — trace + metric 둘 다 같은 base URL 사용
  otlp:
    tracing:
      endpoint: ${OTEL_COL_ENDPOINT:http://localhost:4318}/v1/traces
    metrics:
      export:
        enabled: ${METRICS_ACTIVATED:true}
        url: ${OTEL_COL_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s                          # 30초마다 push
        aggregation-temporality: cumulative # Prometheus 호환

  # Micrometer 메트릭 설정
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true         # latency 히스토그램 (p95/p99 계산용)
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    enable:
      jvm: true
      lettuce: true
      hikaricp: true
      kafka: true
    tags:
      application: ${spring.application.name}

# OpenTelemetry Spring Boot starter
#
# starter 의 servlet 계측과 Micrometer 의 http.server.requests 관측이 각각 HTTP 서버 span 을
# 만들어, 요청 하나에 SERVER span 이 두 개씩 나가고 있었다.
#   watchbox-spring  http get /api/members/mypage   (Micrometer — 하위 span 을 전부 달고 있음)
#                    GET /api/members/mypage        (starter — 자식 없는 leaf)
#
# Tempo service graph 는 (traceID, 부모 spanID) 로 엣지를 키잉하므로 같은 엣지가 두 번
# upsert 되고, span-metrics 에서도 요청 하나가 서로 다른 두 이름으로 계상된다.
#
# starter 쪽을 끈다. Micrometer 쪽을 끄면 @Observed 커스텀 span 과 http_server_requests
# 메트릭(위 percentiles-histogram 설정 포함)까지 같이 사라진다.
# JDBC · Kafka 등 나머지 starter 계측은 영향 없다.
otel:
  instrumentation:
    spring-webmvc:
      enabled: false

# Continuous profiling (Pyroscope)
pyroscope:
  enabled: ${PYROSCOPE_ENABLED:false}
  server:
    address: http://${O11Y_PRIVATE_IP:localhost}:4040
  profiling-interval-ms: ${PYROSCOPE_PROFILING_INTERVAL_MS:10}
  
notification:
  sse:
    timeout: 30m
    heartbeat: 30s

  # 알림 이벤트 outbox 릴레이.
  # 기록 직후 트리거가 즉시 깨우므로 poll-interval 은 '트리거 유실 + 재시도' 를 받쳐주는 백스톱이다.
  # 짧을수록 재시도가 빨라지지만 그만큼 빈 조회가 늘어난다.
  outbox:
    poll-interval: ${OUTBOX_POLL_INTERVAL:5s}
    base-backoff: ${OUTBOX_BASE_BACKOFF:5s}    # 실패마다 2배씩 늘어난다
    max-backoff: ${OUTBOX_MAX_BACKOFF:60s}     # 간격 상한. 크면 복구 후 반영이 느려진다
    # 행 단위 백스톱. 반드시 아래 채널 상한보다 커야 한다 —
    # 같거나 작으면 채널이 종결되기 전에 행이 조회에서 빠져 영원히 미발행으로 남는다.
    max-attempt: ${OUTBOX_MAX_ATTEMPT:20}

  # 채널별 재시도 상한. 만회 경로가 다르므로 값도 다르다.
  # (SSE 는 실패해도 알림함 + catchup 이 만회하지만, 메일은 못 보내면 끝이다)
  # 시연 중에는 값을 올려 재시도 창을 넓힐 수 있다 — 상한에 닿으면 종결되어 되돌려도 발송되지 않는다.
  delivery:
    sse-max-attempt: ${SSE_MAX_ATTEMPT:5}
    mail-max-attempt: ${MAIL_MAX_ATTEMPT:10}

  # 메일은 SSE 로 닿지 않는 사용자에게 초대를 전달하는 보조 채널이다.
  # enabled=false 면 발송하지 않고 로그만 남긴다 — 로컬·테스트에서 실제 주소로 메일이 나가는 사고를 막는다.
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: no-reply@watch-box.net       # SES 에 인증된 도메인이어야 한다
    support-address: watchboxnet@gmail.com

