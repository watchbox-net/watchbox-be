server:
  port: 9000
#  compression:
#    enabled: true
#    mime-types: application/json
#    min-response-size: 2048

#logging:
#  level:
#    root: INFO
#    net.watchbox: INFO

spring:
  application:
    name: watchbox-spring

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        highlight_sql: true
        generate_statistics: false
    open-in-view: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/watchbox?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:95206326}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      #      password: ${REDIS_PASSWORD:}      # 로컬 dev 는 비워두기, 운영은 환경변수
      database: 0                        # Redis DB 인덱스 (0~15), 기본 0
      client-type: lettuce
      timeout: 2s                        # 명령 실행 timeout (중요)
      connect-timeout: 2s                # 커넥션 연결 timeout
      lettuce:
        pool:
          enabled: false                 # Lettuce 는 공유 커넥션 사용, 기본 비활성화
        shutdown-timeout: 100ms          # 종료 시 대기

  web:
    resources:
      add-mappings: false # 정적 리소스 자동 매핑 비활성화하여 예외(NoHandlerFoundException) 발생시키기 위함

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account

  cloud:
    aws:
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${S3_BUCKET}
        exp-time: 300000  # presigned URL 유효시간 (ms) = 5분

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all # 모든 replica ACK (안전)
      retries: 3
      properties:
        enable.idempotence: true # 중복 방지

    consumer:
      group-id: watchbox-consumer-${spring.profiles.active}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: net.watchbox.*
        spring.json.use.type.headers: false

    # AdminClient 용 (헬스체크에서 사용)
    admin:
      properties:
        request.timeout.ms: 3000

# 토픽 이름 환경별 분리 (이전 답변의 A안)
kafka:
  topics:
    health-check: ${spring.profiles.active}.healthcheck
    notification-events: ${spring.profiles.active}.notification-events

#logging:
#  level:
#    org.hibernate.orm.jdbc.bind: trace

tmdb:
  api:
    key: ${TMDB_API_KEY}
    base-url: https://api.themoviedb.org/3
    include_adult: true
  image-url: https://image.tmdb.org/t/p/w500

url:
  frontend: ${URL_FRONTEND:http://localhost:4000}
  oauth-callback: ${URL_OAUTH_CALLBACK:http://localhost:4000/api/auth/callback}
#  backend:  ${URL_BACKEND:http://localhost:9000}

admin:
  api-key: ${ADMIN_API_KEY:admin}

jwt:
  issuer: ${JWT_ISSUER:abc}
  secret_key: ${JWT_SECRET_KEY:abcdefgh1234567890}
  access_token_expiry: ${ACCESS_TOKEN_EXPIRY:900}s # 15분 (900초)
  refresh_token_expiry: ${REFRESH_TOKEN_EXPIRY:604800}s # 7일 (604800초)

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    doc-expansion: none
    persist-authorization: true
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info               # actuator UI 만 (prometheus 안 씀 — OTel push)
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

  opentelemetry:
    resource-attributes:
      service.namespace: watchbox
      deployment.environment: ${SPRING_PROFILES_ACTIVE:local}

  # Trace
  tracing:
    enabled: ${TRACING_ACTIVATED:true}
    sampling:
      probability: ${TRACING_SAMPLE_RATIO:1.0}
    propagation:
      type: w3c

  # OTLP exporter — trace + metric 둘 다 같은 base URL 사용
  otlp:
    tracing:
      endpoint: ${OTEL_COL_ENDPOINT:http://localhost:4318}/v1/traces
    metrics:
      export:
        enabled: ${METRICS_ACTIVATED:true}
        url: ${OTEL_COL_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s                          # 30초마다 push
        aggregation-temporality: cumulative # Prometheus 호환

  # Micrometer 메트릭 설정
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true         # latency 히스토그램 (p95/p99 계산용)
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    enable:
      jvm: true
      lettuce: true
      hikaricp: true
      kafka: true
    tags:
      application: ${spring.application.name}

# Continuous profiling (Pyroscope)
pyroscope:
  enabled: ${PYROSCOPE_ENABLED:true}
  server:
    address: http://${O11Y_PRIVATE_IP:localhost}:4040
  profiling-interval-ms: ${PYROSCOPE_PROFILING_INTERVAL_MS:10}
